[project]
name = "oc-pruner"
version = "0.1.2"
description = "A tool for removing invalid rows from an OpenCitations metadata or citations table based on the table's validation report."
authors = [
    {name = "Elia Rizzetto",email = "elia.rizzetto@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "oc-validator (>=0.3.13,<0.4.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[project.scripts]
oc_pruner = "oc_pruner.cli:main"