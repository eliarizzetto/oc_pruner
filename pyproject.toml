[project]
name = "oc-pruner"
version = "0.2.0"
description = "A tool for removing invalid rows from an OpenCitations metadata or citations table based on the table's validation report."
authors = [{ name = "Elia Rizzetto", email = "elia.rizzetto@gmail.com" }]
requires-python = ">=3.11,<3.14"
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "pyyaml (>=6.0.3,<7.0.0)",
    "oc-validator (>=1.0.0,<2.0.0)",
    "oc-ds-converter (>=2.0.0,<3.0.0)",
]

[project.scripts]
oc_pruner = "oc_pruner.cli:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
